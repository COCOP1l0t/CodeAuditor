[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "code-auditor"
version = "0.1.0"
description = "Web-based multi-stage code auditing agent application using Claude Code or Codex backends"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.48",
    "codex-app-server-sdk @ https://github.com/openai/codex/archive/6e838a19fa52f2c30442c5bd2913acd1e6fe4c9d.tar.gz#subdirectory=sdk/python",
    "cryptography>=42",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=14",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
code-auditor = "code_auditor.__main__:main"

[tool.uv.build-backend]
module-name = "code_auditor"
module-root = ""
wheel-exclude = ["tests/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
